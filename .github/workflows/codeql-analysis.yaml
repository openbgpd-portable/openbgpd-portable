name: CodeQL analysis

on:
  push:
  pull_request:
  schedule:
    # build the main branch every Monday morning
    - cron: '22 5 * * 1'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Initialize CodeQL
      uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 #v4.38.2
      with:
        languages: ${{ matrix.language }}
    - name: Build Application using script
      run: |
        sudo apt-get update
        sudo apt-get install libevent-dev
        ./autogen.sh
        ./configure
        make
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd #v4.38.1
      with:
        category: "/language:${{matrix.language}}"
