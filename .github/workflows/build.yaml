name: Build CI

on:
  push:
  pull_request:
  schedule:
    # build the main branch every Monday morning
    - cron: '17 5 * * 1'
  workflow_dispatch:

jobs:
  build-latest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [cc, clang, gcc-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install missing deps
        run: |
          sudo apt-get update
          sudo apt-get install libevent-dev
      - name: autogen
        run: ./autogen.sh
      - name: compiler
        run: $CC -v
        env:
          CC: ${{ matrix.compiler }}
      - name: configure
        run: ./configure
        env:
          CC: ${{ matrix.compiler }}
      - name: make
        run: make -k
      - name: smoke test bgpd config parsing
        run: |
          cat > /tmp/bgpd-smoke.conf <<'EOF'
          AS 65000
          router-id 192.0.2.1
          EOF
          ./src/bgpd/bgpd -n -f /tmp/bgpd-smoke.conf
      - name: make distcheck
        run: make distcheck
        if: matrix.compiler == 'cc'
